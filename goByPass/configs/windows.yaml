app:
  name: ByPass
  version: 1.0.0
  pid_file: "bypass.pid"
  working_dir: "."
  daemonize: false

capture:
  type: windivert

firewall:
  backend: auto
  ports: [80, 443]
  direction: outgoing
  cleanup_on_exit: true

cache:
  ip_cache:
    enabled: true
    ttl: 1h
    max_size: 10000
  domain_cache:
    enabled: true
    ttl: 1h
    max_size: 5000
    preload:
      - google.com
      - youtube.com
      - www.youtube.com
      - accounts.youtube.com
      - i.ytimg.com
      - beacons.gcp.gvt2.com
      - beacons.gvt2.com
      - www.gstatic.com
      - fonts.gstatic.com
      - fonts.googleapis.com
      - telegram.org
      - web.telegram.org
      - kws2.web.telegram.org
      - venus.web.telegram.org

strategy:
  strategy_file: strategies/strategies.json
  append_default_rules: false
  hostname_rules:
    - pattern: "*.googlevideo.com"
      strategy_id: 27
      comment: "Video CDN: ALT5-like TCP"
    - pattern: "*.c.youtube.com"
      strategy_id: 31
      comment: "YouTube CDN/control-video edge"
    - pattern: "youtube.com"
      strategy_id: 31
      comment: "YouTube bare: safe profile"
    - pattern: "*.youtube.com"
      strategy_id: 31
      comment: "YouTube main/web: safe profile"
    - pattern: "accounts.youtube.com"
      strategy_id: 27
      comment: "Accounts: conservative split profile"
    - pattern: "*.youtubei.googleapis.com"
      strategy_id: 27
      comment: "YouTube API: safe profile"
    - pattern: "*.youtube-nocookie.com"
      strategy_id: 27
      comment: "Embed: safe profile"
    - pattern: "*.ytimg.com"
      strategy_id: 31
      comment: "Static assets: safe profile"
    - pattern: "*.ggpht.com"
      strategy_id: 27
      comment: "Images/avatars: safe profile"
    - pattern: "*.gvt1.com"
      strategy_id: 27
      comment: "GVT1: safe profile"
    - pattern: "*.gvt2.com"
      strategy_id: 27
      comment: "GVT2/beacons: safe profile"

    - pattern: "updates.discord.com"
      strategy_id: 222
      comment: "Discord updater: alt5-like"

    - pattern: "*.discord.com"
      strategy_id: 222
    - pattern: "discord.com"
      strategy_id: 222
    - pattern: "*.discord.gg"
      strategy_id: 222
    - pattern: "discord.gg"
      strategy_id: 222
    - pattern: "*.discordapp.net"
      strategy_id: 222
    - pattern: "*.discordapp.com"
      strategy_id: 222
    - pattern: "*.discord.media"
      strategy_id: 222

    - pattern: "*.web.telegram.org"
      strategy_id: 213
      comment: "Telegram Web: handshake+data fallback"
    - pattern: "web.telegram.org"
      strategy_id: 213
      comment: "Telegram Web root"
    - pattern: "*.telegram.org"
      strategy_id: 12
      comment: "Telegram generic: safe split"
    - pattern: "telegram.org"
      strategy_id: 12
    - pattern: "*.t.me"
      strategy_id: 12
    - pattern: "t.me"
      strategy_id: 12

pipeline:
  workers: 4
  packet_queue_size: 10000
  result_queue_size: 1000
  process_timeout: 100ms

sender:
  buffer_size: 65535
  send_timeout: 1s
  batch_size: 10

logging:
  output: stdout
  level: info
