app:
  name: ByPass
  version: 1.0.0
  pid_file: "bypass.pid"
  working_dir: "."
  daemonize: false

capture:
  type: windivert

firewall:
  backend: auto
  ports: [80, 443, 2053, 2083, 2087, 2096, 8443, 19294, 19295, 19296, 19297, 19298, 19299, 19300, 19301, 19302, 19303, 19304, 19305, 19306, 19307, 19308, 19309, 19310, 19311, 19312, 19313, 19314, 19315, 19316, 19317, 19318, 19319, 19320, 19321, 19322, 19323, 19324, 19325, 19326, 19327, 19328, 19329, 19330, 19331, 19332, 19333, 19334, 19335, 19336, 19337, 19338, 19339, 19340, 19341, 19342, 19343, 19344, 50000, 50001, 50002, 50003, 50004, 50005, 50006, 50007, 50008, 50009, 50010, 50011, 50012, 50013, 50014, 50015, 50016, 50017, 50018, 50019, 50020, 50021, 50022, 50023, 50024, 50025, 50026, 50027, 50028, 50029, 50030, 50031, 50032, 50033, 50034, 50035, 50036, 50037, 50038, 50039, 50040, 50041, 50042, 50043, 50044, 50045, 50046, 50047, 50048, 50049, 50050, 50051, 50052, 50053, 50054, 50055, 50056, 50057, 50058, 50059, 50060, 50061, 50062, 50063, 50064, 50065, 50066, 50067, 50068, 50069, 50070, 50071, 50072, 50073, 50074, 50075, 50076, 50077, 50078, 50079, 50080, 50081, 50082, 50083, 50084, 50085, 50086, 50087, 50088, 50089, 50090, 50091, 50092, 50093, 50094, 50095, 50096, 50097, 50098, 50099, 50100]
  direction: outgoing
  cleanup_on_exit: true

cache:
  ip_cache:
    enabled: true
    ttl: 1h
    max_size: 10000
  domain_cache:
    enabled: true
    ttl: 1h
    max_size: 5000
    preload:
      - google.com
      - youtube.com
      - www.youtube.com
      - accounts.youtube.com
      - i.ytimg.com
      - beacons.gcp.gvt2.com
      - beacons.gvt2.com
      - www.gstatic.com
      - fonts.gstatic.com
      - fonts.googleapis.com
      - telegram.org
      - web.telegram.org
      - kws2.web.telegram.org
      - venus.web.telegram.org

strategy:
  strategy_file: strategies/strategies.json
  append_default_rules: false
  hostname_rules:
    - pattern: "*.youtube.com"
      strategy_id: 31
      comment: "YouTube main/web: ALT5-like TCP"
    - pattern: "youtube.com"
      strategy_id: 31
      comment: "YouTube bare: ALT5-like TCP"
    - pattern: "accounts.youtube.com"
      strategy_id: 27
      comment: "Accounts: conservative split profile"
    - pattern: "*.googlevideo.com"
      strategy_id: 31
      comment: "Video CDN: ALT5-like TCP"
    - pattern: "*.youtubei.googleapis.com"
      strategy_id: 31
      comment: "YouTube API: ALT5-like TCP"
    - pattern: "*.youtube-nocookie.com"
      strategy_id: 31
      comment: "Embed: ALT5-like TCP"
    - pattern: "*.ytimg.com"
      strategy_id: 31
      comment: "Static assets: ALT5-like TCP"
    - pattern: "*.ggpht.com"
      strategy_id: 31
      comment: "Images/avatars: ALT5-like TCP"
    - pattern: "*.gvt1.com"
      strategy_id: 31
      comment: "GVT1: ALT5-like TCP"
    - pattern: "*.gvt2.com"
      strategy_id: 31
      comment: "GVT2: ALT5-like TCP"

    - pattern: "updates.discord.com"
      strategy_id: 222
      comment: "Discord updater: alt5-like"

    - pattern: "*.discord.com"
      strategy_id: 222
    - pattern: "discord.com"
      strategy_id: 222
    - pattern: "*.discord.gg"
      strategy_id: 222
    - pattern: "discord.gg"
      strategy_id: 222
    - pattern: "*.discordapp.net"
      strategy_id: 222
    - pattern: "*.discordapp.com"
      strategy_id: 222
    - pattern: "*.discord.media"
      strategy_id: 222

    - pattern: "*.web.telegram.org"
      strategy_id: 213
      comment: "Telegram Web: handshake+data fallback"
    - pattern: "web.telegram.org"
      strategy_id: 213
      comment: "Telegram Web root"
    - pattern: "*.telegram.org"
      strategy_id: 12
      comment: "Telegram generic: safe split"
    - pattern: "telegram.org"
      strategy_id: 12
    - pattern: "*.t.me"
      strategy_id: 12
    - pattern: "t.me"
      strategy_id: 12

pipeline:
  workers: 4
  packet_queue_size: 10000
  result_queue_size: 1000
  process_timeout: 100ms

sender:
  buffer_size: 65535
  send_timeout: 1s
  batch_size: 10

logging:
  output: stdout
  level: info
