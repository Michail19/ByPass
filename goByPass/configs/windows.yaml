app:
  name: ByPass
  version: 1.0.0
  pid_file: "bypass.pid"
  working_dir: "."
  daemonize: false
capture:
  type: windivert

firewall:
  backend: auto
  ports: [80, 443]
  direction: outgoing
  cleanup_on_exit: true

cache:
  ip_cache:
    enabled: true
    ttl: 1h
    max_size: 10000
  domain_cache:
    enabled: true
    ttl: 1h
    max_size: 5000
    preload:
      - google.com
      - youtube.com
      - discord.com
      - telegram.org

strategy:
  strategy_file: ./strategies/strategies.json
  append_default_rules: true
  hostname_rules:
    - pattern: "*.youtube.com"
      strategy_id: 25
      comment: "YouTube TCP: prefer seqovl+fake profile"
    - pattern: "youtube.com"
      strategy_id: 25
      comment: "Bare YouTube: prefer seqovl+fake profile"
    - pattern: "accounts.youtube.com"
      strategy_id: 27
      comment: "Accounts: keep conservative split profile"
    - pattern: "*.googlevideo.com"
      strategy_id: 25
      comment: "YouTube video CDN: prefer seqovl+fake profile"
    - pattern: "*.youtubei.googleapis.com"
      strategy_id: 25
      comment: "YouTube API: prefer seqovl+fake profile"
    - pattern: "*.youtube-nocookie.com"
      strategy_id: 27
      comment: "Embed: keep conservative split profile"
    - pattern: "*.ytimg.com"
      strategy_id: 27
      comment: "Static assets: conservative split profile"
    - pattern: "*.ggpht.com"
      strategy_id: 27
      comment: "Images/avatars: conservative split profile"
    - pattern: "*.gvt1.com"
      strategy_id: 25
      comment: "GVT1: prefer seqovl+fake profile"
    - pattern: "*.gvt2.com"
      strategy_id: 25
      comment: "GVT2: prefer seqovl+fake profile"


    - pattern: "*.discord.com"
      strategy_id: 21
      comment: "Discord HTTPS/Web"
    - pattern: "discord.com"
      strategy_id: 21
      comment: "Discord bare"
    - pattern: "*.discord.gg"
      strategy_id: 21
      comment: "Discord invites"
    - pattern: "discord.gg"
      strategy_id: 21
      comment: "Discord invites"
    - pattern: "*.discordapp.net"
      strategy_id: 21
      comment: "Discord CDN/API"
    - pattern: "*.discord.media"
      strategy_id: 21
      comment: "Discord media"

    - pattern: "*.telegram.org"
      strategy_id: 12
      comment: "Telegram Web"
    - pattern: "telegram.org"
      strategy_id: 12
      comment: "Telegram bare"
    - pattern: "*.t.me"
      strategy_id: 12
      comment: "Telegram short links"
    - pattern: "t.me"
      strategy_id: 12
      comment: "Telegram short links"

pipeline:
  workers: 4
  packet_queue_size: 10000
  result_queue_size: 1000
  process_timeout: 100ms

sender:
  buffer_size: 65535
  send_timeout: 1s
  batch_size: 10

logging:
  output: stdout
  level: info
