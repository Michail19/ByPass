app:
    name: ByPass
    version: 1.0.0
    pid_file: "bypass.pid"
    working_dir: "."
    daemonize: false
capture:
  type: windivert

firewall:
  backend: auto
  ports: [80, 443]
  direction: outgoing
  cleanup_on_exit: true

cache:
  ip_cache:
    enabled: true
    ttl: 1h
    max_size: 10000
  domain_cache:
    enabled: true
    ttl: 1h
    max_size: 5000
    preload:
      - google.com
      - youtube.com
      - discord.com
      - telegram.org

strategy:
  strategy_file: /strategies/strategies.json
  append_default_rules: true
  hostname_rules:
    - pattern: "*.youtube.com"
      strategy_id: 27
      comment: "Override built-in YouTube with SAFE profile"
    - pattern: "youtube.com"
      strategy_id: 27
      comment: "Override built-in bare YouTube"
    - pattern: "accounts.youtube.com"
      strategy_id: 27
      comment: "Override built-in accounts.youtube.com"
    - pattern: "*.googlevideo.com"
      strategy_id: 27
      comment: "Override built-in video CDN"
    - pattern: "*.youtubei.googleapis.com"
      strategy_id: 27
      comment: "Override built-in YouTube API"
    - pattern: "*.youtube-nocookie.com"
      strategy_id: 27
      comment: "Override built-in embed"
    - pattern: "*.ytimg.com"
      strategy_id: 27
      comment: "Override built-in static"
    - pattern: "*.ggpht.com"
      strategy_id: 27
      comment: "Override built-in avatars/images"
    - pattern: "*.gvt1.com"
      strategy_id: 27
      comment: "Override built-in GVT1 with SAFE profile"
    - pattern: "*.gvt2.com"
      strategy_id: 27
      comment: "Override built-in GVT2 with SAFE profile"

    - pattern: "*.telegram.org"
      strategy_id: 12
      comment: "Telegram Web"
    - pattern: "telegram.org"
      strategy_id: 12
      comment: "Telegram bare"
    - pattern: "*.t.me"
      strategy_id: 12
      comment: "Telegram short links"
    - pattern: "t.me"
      strategy_id: 12
      comment: "Telegram short links"

pipeline:
  workers: 4
  packet_queue_size: 10000
  result_queue_size: 1000
  process_timeout: 100ms

sender:
  buffer_size: 65535
  send_timeout: 1s
  batch_size: 10

logging:
  output: stdout
  level: info
