id: 3
name: "aggressive"
description: "Агрессивная стратегия - split + disorder с низким TTL"
apply_to_http: true
apply_to_tls: true
apply_to_quic: false

split_mode: "after-sni"
split_positions: [1, 5, 10]
split_sni_offset: true

disorder_mode: "ttl-zero"
disorder_pos: [1, 3]
disorder_ttl: 1
disorder_repeats: 2

fake_mode: "md5-sig"
fake_pos: 0
fake_ttl: 8
fake_repeats: 1

http_mod_mode: "all"
host_case: true
extra_space: true
dot_at_end: true

tls_record_split: true
tls_record_size: 64

window_size: 0
ip_id: 0
ttl: 0
dup_count: 0
dup_ttl: 0

priority: 30
